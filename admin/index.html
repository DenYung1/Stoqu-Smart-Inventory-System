<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stoqu Admin - Payment Management</title>
    <meta name="description" content="Stoqu Admin Dashboard - Manage subscriptions, approve payments, and oversee user accounts" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      /* Prevent flash of unstyled content */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f9fafb;
        color: #111827;
      }
      
      #admin-root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      /* Loading state */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      
      .spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid #e5e7eb;
        border-top: 2px solid #059669;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #6b7280;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="admin-root">
      <!-- Loading state while app initializes -->
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading Admin Dashboard...</div>
      </div>
    </div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
